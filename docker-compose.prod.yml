# Demo deployment on a single server (AWS EC2): API + MongoDB.
#   cp .env.production.example .env.production   # then edit it
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api node dist/database/seed.js
services:
  api:
    build: .
    restart: always
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 8000
      MONGODB_URI: mongodb://mongo:27017/reservaditos
    ports:
      - '${HTTP_PORT:-80}:8000'
    depends_on:
      mongo:
        condition: service_healthy

  # Not published to the internet: only the API reaches it through the compose network.
  mongo:
    image: mongo:7
    restart: always
    command: ['--wiredTigerCacheSizeGB', '0.25']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mongo-data:
